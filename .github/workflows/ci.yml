name: CI/CD

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  release:
    types: [ published ]

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  NuGetDirectory: ${{ github.workspace}}/nuget

defaults:
  run:
    shell: pwsh

jobs:
  create_nuget:
    runs-on: ubuntu-latest
    name: Create NuGet packages
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Get all history to allow automatic versioning using MinVer

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x
      
    - name: Cache NuGet packages 
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore

    - name: Create NuGet package
      run: dotnet msbuild -t:Pack src/UTF-unknown.csproj -p:Configuration=Release -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg -p:ContinuousIntegrationBuild=true -p:EmbedUntrackedSources=true -p:PackageOutputPath=${{ env.NuGetDirectory }} -verbosity:minimal -p:FileVersion=2.1.${{ github.run_number }} 

    - name: Upload packages to artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nuget
        if-no-files-found: error
        retention-days: 7
        path: ${{ env.NuGetDirectory }}/*

  validate_nuget:
    runs-on: ubuntu-latest
    needs: [ create_nuget ]
    steps:
      - name: Install .NET
        uses: actions/setup-dotnet@v4

      - name: Download NuGet package
        uses: actions/download-artifact@v4
        with:
          name: nuget
          path: ${{ env.NuGetDirectory }}

      - name: Install nuget validator
        run: dotnet tool update Meziantou.Framework.NuGetPackageValidation.Tool --global

      # Validate metadata and content of the NuGet package
      # https://www.nuget.org/packages/Meziantou.Framework.NuGetPackageValidation.Tool#readme-body-tab
      - name: Validate package
        run: meziantou.validate-nuget-package (Get-ChildItem "${{ env.NuGetDirectory }}/*.nupkg")

  run_test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        include:
          # Only test on all frameworks on Windows, incl. net481 (closest to original AppVeyor setup)
          - os: windows-latest
            test-frameworks: ''
          # Test .NET 8.0, 9.0 and 10.0 on Linux and macOS (net481 is Windows-only)
          - os: ubuntu-latest
            test-frameworks: 'net8.0,net9.0,net10.0'
          - os: macos-latest
            test-frameworks: 'net8.0,net9.0,net10.0'
    name: Run tests on ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    
    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x
      
    - name: Cache NuGet packages 
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore
      
    - name: Run tests
      run: |
        $frameworks = '${{ matrix.test-frameworks }}'
        if ([string]::IsNullOrEmpty($frameworks)) {
          dotnet test --configuration Release --no-restore --logger trx --results-directory "TestResults-${{ matrix.os }}"
        } else {
          foreach ($fw in $frameworks.Split(',')) {
            $fw = $fw.Trim()
            dotnet test --configuration Release --no-restore --logger "trx;LogFileName=TestResults_${{ matrix.os }}_$fw.trx" --results-directory "TestResults-${{ matrix.os }}" --framework $fw
          }
        }
      
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.os }}
        path: TestResults-${{ matrix.os }}/*.trx

  deploy:
    # Publish only when creating a GitHub Release
    # https://docs.github.com/en/repositories/releasing-projects-on-github/managing-releases-in-a-repository
    # You can update this logic if you want to manage releases differently
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: [ validate_nuget, run_test ]
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Download NuGet package
        uses: actions/download-artifact@v4
        with:
          name: nuget
          path: ${{ env.NuGetDirectory }}

      - name: Install .NET
        uses: actions/setup-dotnet@v4

      - name: Authenticate to NuGet.org with trusted publishing
        uses: NuGet/login@v3
        id: nuget_login
        with:
          user: ${{ secrets.NUGET_USERNAME }}
      # Publish the NuGet package to NuGet.org using the OIDC token issued by GitHub Actions.
      # The NuGet.org package must be configured for trusted publishing in the package owner account.
      - name: Publish NuGet package to nuget.org
        run: |
          foreach($file in (Get-ChildItem "${{ env.NuGetDirectory }}" -Recurse -Include *.nupkg, *.snupkg)) {
              dotnet nuget push $file --source https://api.nuget.org/v3/index.json --skip-duplicate
          }
